<header class="site-header">
  <div class="nav-shell">
    <a class="brand" href="#home" (click)="closeMobileMenu()" aria-label="Shariq Saifi home"
      ><span class="brand-mark">s<span>.</span></span
      ><span>shariq<span class="brand-last">saifi</span><span class="mint">.</span></span></a
    >
    <nav class="desktop-nav" aria-label="Main navigation">
      @for (item of navItems; track item.id) {
        <a
          [href]="'#' + item.id"
          [class.active]="workspaceService.activeSection() === item.id"
          [attr.aria-current]="workspaceService.activeSection() === item.id ? 'location' : null"
          >{{ item.label }}</a
        >
      }
    </nav>
    <div class="nav-actions">
      @if (bugDefense.available()) {
        <button class="bug-replay" (click)="bugDefense.play()" title="Replay the 9-second bug defense animation" aria-label="Replay bug defense animation"><span aria-hidden="true">↻</span> Bug defense</button>
      }
      <a
        class="header-social"
        [href]="personal.github"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub profile"
        title="GitHub"
        ><img src="logos/github.svg" alt="" width="18" height="18" /><span>GitHub</span></a
      >
      <a
        class="header-social"
        [href]="personal.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn profile"
        title="LinkedIn"
        ><img src="logos/linkedin.svg" alt="" width="18" height="18" /><span>LinkedIn</span></a
      >
      <button
        class="icon-button"
        (click)="workspaceService.toggleTheme()"
        [attr.aria-label]="
          workspaceService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
        "
      >
        {{ workspaceService.theme() === 'dark' ? '☀' : '☾' }}
      </button>
      <a class="nav-contact" href="#contact">Let’s talk <span>↗</span></a>
      <button
        class="icon-button mobile-menu-btn"
        (click)="toggleMobileMenu($event)"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="mobile-nav-panel"
        [attr.aria-label]="isMobileMenuOpen() ? 'Close menu' : 'Open menu'"
      >
        {{ isMobileMenuOpen() ? '✕' : '☰' }}
      </button>
    </div>
  </div>
  @if (isMobileMenuOpen()) {
    <nav id="mobile-nav-panel" aria-label="Mobile navigation">
      @for (item of navItems; track item.id) {
        <a [href]="'#' + item.id" (click)="closeMobileMenu()">{{ item.label }}</a>
      }
      <a href="#contact" (click)="closeMobileMenu()">Contact ↗</a>
    </nav>
  }
</header>
