<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Shariq Saifi | SDET & Quality Engineering</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Reset reloads before the browser restores a scroll position or follows a fragment.
      if (performance.getEntriesByType('navigation')[0]?.type === 'reload') {
        history.scrollRestoration = 'manual';
        if (location.hash) {
          history.replaceState(history.state, '', location.pathname + location.search);
        }
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        window.addEventListener(
          'pageshow',
          () => window.scrollTo({ top: 0, left: 0, behavior: 'instant' }),
          { once: true },
        );
      }
    </script>
    <meta
      name="description"
      content="Mohammad Shariq Saifi, SDET with four years of experience in test automation, API testing, and quality engineering. Open to opportunities across industries."
    />
    <meta
      name="keywords"
      content="SDET, Quality Engineering, Test Automation, API Testing, Software Testing, Selenium, Playwright, Java, Python, Portfolio"
    />
    <meta name="author" content="Shariq" />
    <meta name="theme-color" content="#101719" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=2" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
