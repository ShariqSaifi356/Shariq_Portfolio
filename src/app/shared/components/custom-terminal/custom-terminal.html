<div
  class="w-full max-w-2xl mx-auto rounded-xl bg-white/85 dark:bg-slate-950/85 shadow-2xl overflow-hidden border border-blue-200 dark:border-blue-500/20 text-xs sm:text-sm text-slate-700 dark:text-slate-300 transition-all duration-300 backdrop-blur-xl"
  (click)="focusInput()"
>
  <div
    class="bg-slate-100/90 dark:bg-slate-900/80 px-4 py-3 flex items-center justify-between border-b border-slate-200 dark:border-white/5 select-none"
  >
    <div class="flex items-center gap-2 text-primary font-semibold">
      <span
        class="flex h-7 w-7 items-center justify-center rounded-md bg-blue-500/10 border border-blue-500/20"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.8"
          stroke="currentColor"
          class="w-4.5 h-4.5"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v2" />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8 6.5h8a3 3 0 0 1 3 3v4.25a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V9.5a3 3 0 0 1 3-3Z"
          />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 11h.01M13 11h.01" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.75 14.25c1.5 1 4 1 5.5 0" />
          <path stroke-linecap="round" stroke-linejoin="round" d="m15.75 18.25 1.5 1.5 3-3" />
        </svg>
      </span>
      <span>QA Workspace</span>
    </div>
    <span class="text-xs text-slate-500 dark:text-slate-400 font-semibold">
      Interactive overview
    </span>
  </div>

  <div
    #terminalBody
    class="p-4 sm:p-6 h-80 sm:h-96 overflow-y-auto space-y-2 select-text bg-slate-50/80 dark:bg-slate-950/40"
  >
    @for (line of lines(); track $index) {
      <div
        [ngClass]="{
          'text-primary font-semibold': line.type === 'input',
          'text-slate-800 dark:text-slate-200': line.type === 'output',
          'text-red-600 dark:text-red-400': line.type === 'error',
          'text-accent font-semibold': line.type === 'success',
        }"
      >
        {{ line.text }}
      </div>
    }

    @if (!isTyping()) {
      <form (submit)="handleCommand($event)" class="flex items-center w-full pt-2">
        <div class="relative flex-grow flex items-center">
          <input
            #cmdInput
            type="text"
            [ngModel]="currentInput()"
            (ngModelChange)="currentInput.set($event)"
            name="command"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="Explore skills, projects, contact, theme, or clear"
            class="h-10 w-full rounded-md border border-slate-200 dark:border-white/10 bg-white dark:bg-slate-900 px-3 pr-9 text-slate-800 dark:text-slate-200 outline-hidden focus:border-primary focus:ring-2 focus:ring-primary/20 selection:bg-blue-500/40"
            aria-label="QA workspace input"
          />
          <span
            class="absolute right-3 h-2 w-2 rounded-full bg-primary animate-pulse pointer-events-none"
          ></span>
        </div>
      </form>
    } @else {
      <div class="flex items-center space-x-1">
        <span class="h-2 w-2 rounded-full bg-primary animate-pulse"></span>
      </div>
    }
  </div>
</div>
