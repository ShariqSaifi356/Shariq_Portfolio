<div 
  class="w-full max-w-2xl mx-auto rounded-xl glass shadow-2xl overflow-hidden border border-blue-500/20 font-mono text-xs sm:text-sm text-slate-600 dark:text-slate-300 transition-all duration-300"
  (click)="focusInput()"
>
  <!-- Window Header Bar -->
  <div class="bg-slate-900/80 px-4 py-3 flex items-center justify-between border-b border-white/5 select-none">
    <!-- Window Control Dots -->
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
      <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
      <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
    </div>
    <!-- Window Title -->
    <span class="text-xs text-slate-400 font-semibold flex items-center gap-1.5 select-none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5 text-primary">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5" />
      </svg>
      qa_workspace_shell.sh
    </span>
    <!-- Spacer -->
    <div class="w-12"></div>
  </div>

  <!-- Terminal Body Area -->
  <div 
    #terminalBody
    class="p-4 sm:p-6 h-80 sm:h-96 overflow-y-auto space-y-2 select-text"
  >
    @for (line of lines(); track $index) {
      <div [ngClass]="{
        'text-primary font-semibold': line.type === 'input',
        'text-slate-800 dark:text-slate-200': line.type === 'output',
        'text-red-600 dark:text-red-400': line.type === 'error',
        'text-accent font-semibold': line.type === 'success'
      }">
        {{ line.text }}
      </div>
    }

    <!-- Shell Prompt for User Typing -->
    @if (!isTyping()) {
      <form (submit)="handleCommand($event)" class="flex items-center space-x-1 w-full pt-1">
        <span class="text-primary font-semibold whitespace-nowrap">{{ promptPrefix }}</span>
        <div class="relative flex-grow flex items-center">
          <input 
            #cmdInput
            type="text" 
            [ngModel]="currentInput()"
            (ngModelChange)="currentInput.set($event)"
            name="command"
            autocomplete="off" 
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            class="bg-transparent border-0 outline-hidden focus:ring-0 p-0 m-0 w-full text-slate-800 dark:text-slate-200 selection:bg-blue-500/40"
            aria-label="Terminal CLI Command input"
          />
          <!-- Custom Blinking Cursor when input is focused -->
          <span class="w-2 h-4 bg-primary animate-pulse ml-0.5 pointer-events-none"></span>
        </div>
      </form>
    } @else {
      <!-- Blinking Cursor while initial script runs -->
      <div class="flex items-center space-x-1">
        <span class="w-2 h-4 bg-primary animate-pulse ml-0.5"></span>
      </div>
    }
  </div>
</div>
