<div 
  class="min-h-screen transition-colors duration-300" 
  [class.dark]="workspaceService.theme() === 'dark'" 
  [class.light]="workspaceService.theme() === 'light'"
>
  <!-- Ambient Cursor Glow -->
  <div class="cursor-glow-bg"></div>

  <!-- Sticky Header Navbar -->
  <app-header></app-header>

  <!-- Main View Container -->
  <main class="w-full">
    <router-outlet></router-outlet>
  </main>

  <!-- Back to Top Button -->
  <button 
    (click)="scrollToTop()" 
    class="fixed bottom-6 right-6 z-50 p-3 rounded-full glass border border-blue-500/20 text-primary hover:text-white hover:bg-primary/20 hover:border-primary transition-all duration-500 shadow-xl cursor-pointer transform hover:scale-110"
    [class.opacity-0]="!showBackToTop()"
    [class.pointer-events-none]="!showBackToTop()"
    [class.translate-y-4]="!showBackToTop()"
    [class.opacity-100]="showBackToTop()"
    [class.translate-y-0]="showBackToTop()"
    aria-label="Back to Top"
  >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
    </svg>
  </button>

  <!-- Floating QA Element Inspector -->
  <app-qa-inspector></app-qa-inspector>

  <!-- Global Snackbar Toast Notification -->
  @if (workspaceService.snackbarMessage(); as msg) {
    <div class="fixed bottom-6 right-6 z-50 glass border border-blue-500/20 bg-slate-900/95 text-white rounded-lg shadow-2xl px-5 py-3 flex items-center space-x-3 transition-all duration-300 animate-pulse-slow">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 text-accent animate-bounce">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="font-sans text-xs sm:text-sm font-semibold select-none text-slate-100">{{ msg }}</span>
    </div>
  }
</div>
